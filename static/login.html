<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBookShelf - Login</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: var(--bg, #f5f5f5);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .auth-card {
            background: var(--surface, #fff);
            border: 1px solid var(--border, #ddd);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .auth-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text, #333);
            margin: 0 0 24px;
        }
        .auth-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            border: 1px solid var(--border, #ddd);
            border-radius: 8px;
            overflow: hidden;
        }
        .auth-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary, #666);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.15s, color 0.15s;
        }
        .auth-tab.active {
            background: var(--accent, #5b6abf);
            color: #fff;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .auth-input {
            padding: 12px 14px;
            border: 1px solid var(--border, #ddd);
            border-radius: 8px;
            font-size: 0.95rem;
            background: var(--bg, #f5f5f5);
            color: var(--text, #333);
            outline: none;
            transition: border-color 0.15s;
        }
        .auth-input:focus {
            border-color: var(--accent, #5b6abf);
        }
        .auth-submit {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--accent, #5b6abf);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .auth-submit:hover {
            opacity: 0.9;
        }
        .auth-error {
            display: none;
            padding: 10px 14px;
            border-radius: 8px;
            background: #fef2f2;
            color: #dc2626;
            font-size: 0.9rem;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1 class="auth-title">MyBookShelf</h1>
        <div class="auth-tabs">
            <button class="auth-tab active" id="login-tab">Login</button>
            <button class="auth-tab" id="register-tab">Register</button>
        </div>
        <form class="auth-form" id="auth-form">
            <input class="auth-input" type="text" id="username" placeholder="Username" autocomplete="username" required>
            <input class="auth-input" type="password" id="password" placeholder="Password" autocomplete="current-password" required>
            <div class="auth-error" id="auth-error"></div>
            <button class="auth-submit" type="submit" id="submit-btn">Login</button>
        </form>
    </div>

    <script>
        (function() {
            // If already logged in, redirect
            if (localStorage.getItem('token')) {
                window.location.href = '/';
                return;
            }

            let mode = 'login';
            const loginTab = document.getElementById('login-tab');
            const registerTab = document.getElementById('register-tab');
            const submitBtn = document.getElementById('submit-btn');
            const form = document.getElementById('auth-form');
            const errorDiv = document.getElementById('auth-error');
            const passwordInput = document.getElementById('password');

            function setMode(newMode) {
                mode = newMode;
                loginTab.classList.toggle('active', mode === 'login');
                registerTab.classList.toggle('active', mode === 'register');
                submitBtn.textContent = mode === 'login' ? 'Login' : 'Register';
                passwordInput.autocomplete = mode === 'login' ? 'current-password' : 'new-password';
                errorDiv.style.display = 'none';
            }

            loginTab.addEventListener('click', function() { setMode('login'); });
            registerTab.addEventListener('click', function() { setMode('register'); });

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                errorDiv.style.display = 'none';

                var username = document.getElementById('username').value.trim();
                var password = document.getElementById('password').value;

                if (!username || !password) {
                    errorDiv.textContent = 'Please enter username and password';
                    errorDiv.style.display = 'block';
                    return;
                }

                var endpoint = mode === 'login' ? '/auth/login' : '/auth/register';

                fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                })
                .then(function(resp) {
                    return resp.json().then(function(data) {
                        return { status: resp.status, data: data };
                    });
                })
                .then(function(result) {
                    if (result.status === 200 || result.status === 201) {
                        localStorage.setItem('token', result.data.token);
                        localStorage.setItem('username', result.data.user.username);
                        window.location.href = '/';
                    } else {
                        var msg = result.data.error || 'An error occurred';
                        errorDiv.textContent = msg;
                        errorDiv.style.display = 'block';
                    }
                })
                .catch(function() {
                    errorDiv.textContent = 'Network error. Please try again.';
                    errorDiv.style.display = 'block';
                });
            });
        })();
    </script>
</body>
</html>
